<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Desktop Avatar chat</title>
<link rel="stylesheet" href="./chat.css">
</head>
<body>
  <form id="pill" autocomplete="off">
    <img id="face" src="../../../assets/icon-64.png" alt="">
    <input id="text" type="text" maxlength="500" spellcheck="true" placeholder="Ask me to do something…">
    <button id="dice" type="button" title="Suggest a name">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><circle class="pip" cx="9" cy="9" r="1.4"/><circle class="pip" cx="15" cy="9" r="1.4"/><circle class="pip" cx="12" cy="12" r="1.4"/><circle class="pip" cx="9" cy="15" r="1.4"/><circle class="pip" cx="15" cy="15" r="1.4"/></svg>
    </button>
    <button id="mic" type="button" title="Talk instead (voice)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none"/></svg>
    </button>
    <button id="send" type="submit" title="Send (Enter)">
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h14M13 6l6 6-6 6" fill="none"/></svg>
      <svg class="check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none"/></svg>
    </button>
  </form>
  <div id="status"><span id="dot"></span><span id="statusText"></span><span class="keys" id="keys">Enter send · Esc close · ↑ history</span></div>
  <script type="module" src="./chat.js"></script>
</body>
</html>
